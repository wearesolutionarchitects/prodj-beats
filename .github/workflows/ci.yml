name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Verify app and bridge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Check Astro types
        run: npm run check

      - name: Replay fixtures
        run: npm run fixture:replay

      - name: Build web app
        run: npm run build

      - name: Fetch Java bridge dependencies
        run: npm run bridge:deps

      - name: Build Java bridge
        run: npm run bridge:build
